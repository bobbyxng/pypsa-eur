# config.prepare_aro.yaml with a *binding* CO2 cap, and nothing else changed.
#
# The base fixture inherits config.default's `co2_budget` (relative: true, 2030: 0.45). That is
# 45% of Belgium's *economy-wide* 1990 emissions -- ~54 Mt/a -- applied to a model that only
# contains electricity, which emits ~0.15 Mt over this week against a 1.04 Mt allowance. So the
# constraint exists but sits at ~15% of its cap and never binds, and the optimiser is free to
# meet an outage with unabated gas. Upstream's migration guide flags exactly this:
# "for electricity-only runs the baseline still covers every sector that is flagged in
# `sector:`, which makes a relative budget almost non-binding."
#
# PyPSARO's production configs do *not* look like that -- they carry an absolute net-zero cap
# (`relative: false`, `upper: {2050: 0.0}`), inherited from the old `co2limit_enable`/`co2limit`
# pair. This fixture reproduces those semantics at the test scale, so the robust design is
# forced to hedge outages with something other than gas. Keep it identical to
# config.prepare_aro.yaml apart from `run.name` and the `co2_budget` block.
#
# Before upstream's streamlined workflow (#1838) one run produced both an electricity-only
# `base_s_5_elec_.nc` and a sector-coupled `base_s_5___2030.nc`. There is now a single
# `composed_{horizon}.nc` per run whose content depends on `sector.enabled`, so the
# comparison needs two runs.
#
# Deliberately separate files rather than an edit to config.overnight.yaml, which is an
# upstream file: new files re-apply cleanly when this branch is merged onto a newer tag.
tutorial: true

run:
  name: "test-prepare-aro-co2-0"
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight
planning_horizons: 2030

# Absolute (Gt/a), matching the production configs' semantics rather than config.default's
# relative-to-1990 fraction. The unused default years are nulled: config files are deep-merged,
# so omitting them would leave upstream's relative fractions to be reread as Gt.
co2_budget:
  relative: false
  upper:
    2030: 0.0
    2020:
    2025:
    2035:
    2040:
    2045:
    2050:
  lower:

countries: ['BE']

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

electricity:

  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, nuclear]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]

atlite:
  default_cutout: be-03-2013-era5
  cutouts:
    be-03-2013-era5:
      module: era5
      x: [4., 15.]
      y: [46., 56.]
      time: ["2013-03-01", "2013-03-08"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  temporal:
    averaging: 24h
  cluster_network:
    n_clusters: 5

sector:
  # Off: prepare_aro_network's whole point is to serve heat without the sector layer. The
  # heat *resources* it reads (cop_profiles, district_heat_share, ...) are still built --
  # those rules are not gated on sector.enabled and the rule requests them explicitly.
  enabled: false
  gas_network: true
  H2_retrofit: true
  residential_heat:
    dsm:
      enable: true
      direction:
      - overheat
      restriction_value:
        2020: 0.06
        2025: 0.16
        2030: 0.27
      restriction_time:
      - 10
      - 21
  district_heating:
    ptes:
      supplemental_heating:
        enable: true
        booster_heat_pump: true
    ates:
      enable: true
  heat_pump_sources:
    urban central:
    - air
    - geothermal
    - river_water
    - sea_water
    urban decentral:
    - air
    rural:
    - air
    - ground
  hydrogen_turbine: false
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  co2_spatial: false
  co2_network: false
  methanol:
    methanol_to_power:
      ocgt: false
    biomass_to_methanol: false
  ammonia: false
  biomass_spatial: false
  biomass_to_liquid: false
  electrobiofuels: false

industry:
  HVC_environment_sequestration_fraction: 0.5
  waste_to_energy: true
  waste_to_energy_cc: true

solving:
  solver:
    name: highs
    options: highs-default
  mem_mb: 4000

  check_objective:
    enable: false
    expected_value: 6.96e+08

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: auto
  costs_threshold: 0.001
  energy_max: auto
  energy_min: auto
  energy_threshold: 0.00001
  interactive_bus_balance:
    bus_name_pattern: "*central heat*"
  enable_heat_source_maps: true

# Shares chosen to exercise both technologies and the per-country override path.
aro:
  heat:
    enable: true
    shares:
      BE: {heat_pump: 0.85, resistive: 0.05}
    default_shares: {heat_pump: 0.90, resistive: 0.05}
